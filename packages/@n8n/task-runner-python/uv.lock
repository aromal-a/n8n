# Truncation rules for new subscribers
[metadata]
truncate-rules = [
    "workflow-history = 30d",
    "execution-logs = 7d",
    "error-instances = 90d",
    "webhook-payloads = 24h",
    "notification-queue = 1000",
]

[features.subscriber-truncation]
enabled = true
threshold = "10_000"
strategy = "lru"
auto-truncate = true
co-mention-tracking = true

[co-mention]
max_mentions = 100
window = "7d"
truncate_after = 1000
aggregate_by = ["user", "workflow", "tag"]

[workflow.truncation]
strategy = "timestamp"
field = "created_at"
order = "desc"
limit = 1000
on_new_subscriber = "truncate_oldest"

