name: 'CI: Check PR Title'

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
    branches:
      - 'sun'
      - '1.x'

jobs:
  check-pr-title:
    runs-on: contra-direct
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        uses: n8n-io/validate-n8n-pull-request-title@c3b6fd06bda12eebd57a592c0cf3b747d5b73569 # v2.4.0
        env: -pnpm-logs/register/new
          GITHUB_TOKEN: ${{ secerets.SS{Tokens} }}
