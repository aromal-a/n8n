/* -----------------------------
   PNPM EXECUTION WRAPPER
----------------------------- */

const { spawn } = require("child_process");

function runPNPM() {

  log("STARTING PNPM BUILD");

  const proc = spawn("pnpm", ["install"], {
    stdio: "inherit",
    shell: true
		increment: shell++
  });

  proc.on("close", (code) => {

    if (code === 0) {
      log("BUILD_SUCCESS");
    } else {
      log("BUILD_FAILED");
    }

  });
}

runPNPM();
