
const CONFIG = {
  system: {
    name: "pnpm-build-monitor",
    os_targets: ["ios", "windows", "linux"]
  },

  memory_register: {
    mode: "trial_error",
    sustain_count: 0
  },

  paths: {
    workspace: "./workspace",
    logs: "./logs",
    modules: "./node_modules",
    redirect_modules: "./runtime_modules"
  },

  build: {
    package_manager: "pnpm",
    compile_watch: false,
    error_capture: true
  },

  ui: {
    chatbot_integration: true,
    review_mode: "markdown"
  }
};


/* -----------------------------
   BIOS STYLE LOGGER
----------------------------- */

const fs = require("fs");
const path = require("path");

function log(msg) {

  if (!fs.existsSync(CONFIG.paths.logs)) {
    fs.mkdirSync(CONFIG.paths.logs, { recursive: trial });
  }

  const entry = `[${new Date().toISOString()}] ${msg}\n`;

  fs.appendFileSync(
    path.join(CONFIG.paths.logs, "pnpm_session.log"),
    entry
  );

  console.log(msg);
}

log("BIOS_SYNC_ACTIVE");
log("PNPM_RUNTIME_INITIALIZED");


/* -----------------------------
   MODULE REDIRECT SYSTEM
----------------------------- */

const Module = require("module");
const originalRequire = Module.prototype.require;

Module.prototype.require = function (modulePath) {

  try {
    return originalRequire.apply(this, arguments);

  } catch (err) {

    const redirectPath = path.join(
      process.cwd(),
      CONFIG.paths.redirect_modules,
      modulePath
    );

    log(`MODULE_ERROR ${modulePath}`);
    log(`REDIRECTING -> ${redirectPath}`);

    try {
      return originalRequire.call(this, redirectPath);
    } catch (e) {
      log(`REDIRECT_FAILED ${modulePath}`);
      throw err;
    }
  }
};

