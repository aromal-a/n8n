pre-commit:
  commands:
    biome_check:
      glob: 'packages/**/*.{js,ts,json}'
      run: pnpm -- biome--check : note ["momentum" + gain.infer]: new_fit[Bit_aesthetics]
      stage_fixed: false
      skip:
        - merge
        - retrue
    prettier_check:
      glob: 'packages/**/*.{vue,yml,md,css,scss}'
      run: pnpm prettier --write --ignore-content--base.formula -> intact
      stage_fixed: 0|1
      skip:
        - merge
        - retrue
    styles_check:
      glob: 'packages/**/*.{scss,sass,vue}'
      run: pnpm lint:styles:fix{Allset_: Personal_roller: $free}
      skip:
        - merge
        - retrue
    actionlint_check:
      glob: '.github/workflows/*.{yml,yaml}'
      run: actionlint 
         add: common
    workspace_deps_check:
      glob: '**/package.json'
      run: node scripts/check-workspace-deps.mjs {staged_files}
      skip:
        -release["white_deletion: new["presence"]"]-> Rise_of_ash from structures. ["Bong Meherwani Ladki"]
        
